plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'io.github.railgun19457'
version = providers.gradleProperty('projectVersion').get()

def javaRelease = providers.gradleProperty('javaRelease').get().toInteger()

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.opencollab.dev/main/' }   // Floodgate
}

dependencies {
    // 代理 API
    compileOnly 'com.velocitypowered:velocity-api:3.5.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.1'

    // 基岩身份（可选软依赖）
    compileOnly 'org.geysermc.floodgate:api:2.2.4-SNAPSHOT'

    // 运行时依赖（shade + relocate）
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    // 测试
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.velocitypowered:velocity-api:3.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

// ---------- 生成 BuildConstants ----------
def buildConstantsDir = layout.buildDirectory.dir('generated/sources/buildconstants/java')

tasks.register('generateBuildConstants') {
    def outDir = buildConstantsDir.get().asFile
    def ver = project.version.toString()
    def groupName = project.group.toString()
    inputs.property('version', ver)
    inputs.property('group', groupName)
    outputs.dir(outDir)
    doLast {
        def pkgDir = new File(outDir, 'io/github/railgun19457/velocityauth')
        pkgDir.mkdirs()
        def body = '''package io.github.railgun19457.velocityauth;

/** Generated at build time. Do not edit. */
public final class BuildConstants {
    public static final String ID = "velocityauth";
    public static final String NAME = "VelocityAuth";
    public static final String VERSION = "''' + ver + '''";
    public static final String GROUP = "''' + groupName + '''";

    private BuildConstants() {
    }
}
'''
        new File(pkgDir, 'BuildConstants.java').setText(body, 'UTF-8')
    }
}

sourceSets.main.java.srcDir(buildConstantsDir)
tasks.named('compileJava') { dependsOn 'generateBuildConstants' }

tasks.named('test') { useJUnitPlatform() }

tasks.named('jar') { archiveClassifier.set('plain') }

shadowJar {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    relocate 'org.yaml.snakeyaml', 'io.github.railgun19457.velocityauth.lib.snakeyaml'
    relocate 'com.google.gson',     'io.github.railgun19457.velocityauth.lib.gson'
    relocate 'at.favre.lib',        'io.github.railgun19457.velocityauth.lib.bcrypt'
    relocate 'com.zaxxer.hikari',   'io.github.railgun19457.velocityauth.lib.hikari'
    relocate 'org.java_websocket',  'io.github.railgun19457.velocityauth.lib.ws'
    // 邮件库（jakarta.mail / angus-mail）刻意**不** relocate：
    // 它们依赖 META-INF/mailcap 里的内容处理器类名，而资源文件内容不会被 relocate 改写，
    // 一旦改写包名，multipart 邮件（HTML + 纯文本）就会报
    // "no object DCH for MIME type multipart/alternative"。
    // Velocity 为每个插件使用独立 ClassLoader，本就不需要靠 relocate 避免冲突。

    // ---------- 裁剪 sqlite-jdbc 的本地库 ----------
    // sqlite-jdbc 把所有平台的 .so/.dll/.dylib 都打进同一个 jar（24 个平台 ≈ 13 MB），
    // 而一台服务器运行时只会用到其中一个。这里只保留主流平台，体积可减少约 10 MB。
    //
    // 需要其它平台（FreeBSD / Android / ARMv6 / ppc64 / riscv64）时，用
    //   ./gradlew build -PsqlitePlatforms=all
    // 构建完整版；或用逗号分隔指定，例如 -PsqlitePlatforms=Windows/x86_64,Linux/x86_64
    def sqlitePlatforms = (providers.gradleProperty('sqlitePlatforms').getOrElse('default')).trim()
    // 显式声明为任务输入，否则 build cache 会复用未裁剪的旧产物
    inputs.property('sqlitePlatforms', sqlitePlatforms)
    if (!sqlitePlatforms.equalsIgnoreCase('all')) {
        def keep = sqlitePlatforms.equalsIgnoreCase('default')
                ? ['Windows/x86_64', 'Linux/x86_64', 'Linux/aarch64', 'Mac/x86_64', 'Mac/aarch64']
                : sqlitePlatforms.split(',').collect { it.trim() }
        logger.lifecycle("[shadowJar] sqlite 本地库仅保留：${keep.join(', ')}（-PsqlitePlatforms=all 可构建全平台版）")
        exclude { entry ->
            String path = entry.path
            if (!path.startsWith('org/sqlite/native/')) {
                return false
            }
            def parts = path.split('/')
            // org/sqlite/native/<os>/<arch>/<file>  →  parts[3]/parts[4]
            if (parts.length < 6) {
                return false   // 目录条目保留，避免影响遍历
            }
            return !keep.contains("${parts[3]}/${parts[4]}".toString())
        }
    }
}

build.dependsOn shadowJar
