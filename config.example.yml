# ============ VelocityAuth 配置 ============
# 修改后可用 /vauth reload 热重载（bot.* 除外，改动需重启代理）。

language: zh_cn            # 语言：zh_cn | en_us；文案在 plugins/velocityauth/lang/<语言>.yml

database:
  type: sqlite             # sqlite | mysql
  sqlite:
    file: velocityauth.db  # 相对 plugins/velocityauth/
  mysql:
    host: 127.0.0.1
    port: 3306
    database: velocityauth
    username: root
    password: ""
  login-history-days: 90             # 登录历史（成功/失败/登出）保留天数；0 = 永久保留
  audit-log-days: 90                 # 审计日志保留天数；0 = 永久保留
  binding-history-days: 90           # 绑定历史（bind/unbind/delete）保留天数；0 = 永久保留

servers:
  login: lobby             # 登录服：未认证玩家停留的服务器（必须是专用服）
  default: main            # 认证成功后默认进入的服务器
  allowed:                 # 允许进入的子服白名单（需为 Velocity 已注册的服务器名）
    - main
    - survival
  remember-last: true      # 认证后自动回到上次退出时所在的子服（只在 allowed 内恢复）

auth:
  account-name:
    min-length: 3
    max-length: 16
    pattern: "^[A-Za-z0-9_]+$"       # 账号名正则；唯一性不区分大小写
  password:
    min-length: 6
    max-length: 64                   # bcrypt 只使用前 72 字节，多字节字符超出会被拒绝
  bcrypt-cost: 10                    # 4-16，越大越慢越安全
  session:
    enabled: false                   # 会话保持：同 IP 免密登录。默认关闭（国内 NAT 共享 IP 风险高）
    ttl-minutes: 30                  # 会话有效期
    bind-to-ip: true                 # 是否绑定 IP（关闭则换 IP 也能免密，风险更高）
  bedrock:
    auto-link: true                  # 基岩玩家认证成功后自动关联 Floodgate 身份
                                     #（需 Floodgate 端启用 player-link；否则回退为改写 UUID）

registration:
  require-binding: []        # 注册后必须完成的绑定渠道（provider id），玩家任选其一；空列表 = 无需绑定
                             # 取值须为已配置的渠道：email 或 binding.social 下的渠道 id
  unbound-ttl-minutes: 30    # 注册后一直未绑定的账号，超过这么多分钟自动清除（0 = 不自动清除）

binding:
  email:                     # 内置邮箱渠道（SMTP）
    enabled: true
    max-accounts: 1                  # 同一邮箱最多绑定几个账号
    cooldown-minutes: 0              # 该邮箱解绑/注销后的再绑定冷却（分钟，0 = 不启用）
    domain:
      mode: whitelist                # off | whitelist | blacklist（按 @ 之后的域名精确匹配）
      list: ["qq.com"]
  social:                    # 通用社交渠道：键名即 provider id（可自行增加任意平台）
    qq:
      enabled: true
      display-name: "QQ"             # 提示里展示的渠道名
      max-accounts: 1                # 同一平台账号最多绑定几个账号
      cooldown-minutes: 0            # 解绑/注销后的再绑定冷却（分钟，0 = 不启用）
      code-length: 6                 # 该渠道验证码长度（0 = 用 verification.code-length）
    # discord:                     # 加一个平台就是加一段配置（bot 侧实现对应适配器即可）
    #   enabled: true
    #   display-name: "Discord"

verification:
  code-length: 6                     # 验证码长度（email 为数字码，社交渠道为字母数字）
  ttl-seconds: 300                   # 验证码有效期（秒）
  max-attempts: 5                    # 单个验证码最多尝试次数
  rate-limit:
    per-ip-per-minute: 5             # 单 IP 每分钟最多发起几次验证
    per-account-per-minute: 3        # 单账号每分钟最多发起几次验证

smtp:
  enabled: false                     # 需要邮箱验证/找回时再开
  host: smtp.qq.com
  port: 465
  ssl: true                          # 465 用 true；587 用 false（走 STARTTLS）
  username: ""                       # 你的邮箱，如 example@qq.com
  password: ""                       # QQ 邮箱填授权码，不是登录密码
  from: "VelocityAuth <example@qq.com>"   # 发件人（多数邮箱要求与 username 一致）
  timeout-seconds: 10                # 连接/发送超时

bot:                                 # 平台无关的 bot 通道（原 qqbot）
  enabled: false                     # 需要社交渠道验证/绑定时再开
  listen: "0.0.0.0"                  # WebSocket 监听地址
  port: 8765                         # WebSocket 监听端口
  pairing:
    ttl-seconds: 600                 # 配对码有效期
    max-attempts: 5                  # 配对码最多尝试次数
    bootstrap-code: ""               # 无控制台部署时可预置一次性配对码（只存内存，用后即弃）
  query:
    enabled: false                   # 玩家信息查询接口（query.*）；默认关闭。权限校验由 bot 侧负责
    max-results: 50                  # 单次查询返回的最大条数（列表 / 历史记录）

proxy:
  address: ""                        # 代理对外地址，供 transferToHost 用；留空则用客户端连接时的地址
  port: 0                            # 0 表示使用 velocity.toml 的 bind 端口

security:
  handshake-timeout-seconds: 10      # bot 握手超时
  clock-skew-seconds: 120            # bot 握手帧允许的时间偏差
