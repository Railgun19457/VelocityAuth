# version: 5
# ============ VelocityAuth 中文语言文件 ============
# 文本使用 MiniMessage 语法；{xxx} 为占位符。
prefix: "<gold>[认证]</gold> "

generic:
  player-only: "<red>该命令只能由玩家执行。</red>"
  no-permission: "<red>你没有权限执行该命令。</red>"
  internal-error: "<red>服务器内部错误，请稍后再试。</red>"
  reloaded: "<green>配置与语言文件已重载。</green>"
  not-authenticated: "<red>请先登录。</red>"
  already-authenticated: "<red>你已经登录了。</red>"
  unknown-subcommand: "<red>未知子命令：{input}</red>"
  feature-disabled: "<red>该功能当前已关闭。</red>"
  usage: "<red>用法：{usage}</red>"

command:
  login:
    usage: "<red>用法：/login <账号> <密码></red>"
    success: "<green>登录成功，正在进入服务器…</green>"
    wrong-password: "<red>账号或密码错误。</red>"
    already-authenticated: "<red>你已经登录了。</red>"
    reconnect: "<green>登录成功，请重新连接以进入服务器。</green>"
    rate-limited: "<red>尝试过于频繁，请稍后再试。</red>"
    locked: "<red>该账号已被锁定，请联系管理员。</red>"
    binding-required: "<red>密码正确，但该账号需要先完成绑定才能登录。</red>"
  register:
    usage: "<red>用法：/register <账号> <密码> <确认密码></red>"
    success: "<green>注册成功，正在进入服务器…</green>"
    success-pending: "<green>注册成功！</green><yellow>账号 {account} 需要完成绑定后才能登录。</yellow>"
    name-taken: "<red>该账号名已被占用。</red>"
    name-invalid: "<red>账号名不合法：长度需在 {min}-{max} 之间，且只能包含字母、数字与下划线。</red>"
    password-too-short: "<red>密码太短，至少需要 {min} 个字符。</red>"
    password-too-long: "<red>密码太长，最多 {max} 个字符。</red>"
    password-too-long-bytes: "<red>密码太长：UTF-8 编码后最多 {bytes} 字节（bcrypt 限制），请缩短。</red>"
    password-mismatch: "<red>两次输入的密码不一致。</red>"
    already-registered: "<red>你已经注册或登录了。</red>"
    rate-limited: "<red>注册过于频繁，请稍后再试。</red>"
  logout:
    success: "<yellow>已退出登录，请重新连接。</yellow>"
    not-authenticated: "<red>你尚未登录。</red>"
  verify:
    usage: "<red>用法：/verify <验证码>（或 /verify cancel 取消）</red>"
    success: "<green>验证成功。</green>"
  changepassword:
    usage: "<red>用法：/changepassword <旧密码> <新密码></red>"
    success: "<green>密码修改成功。</green>"
    wrong-password: "<red>旧密码错误。</red>"
    same-as-old: "<red>新密码不能与旧密码相同。</red>"
    not-authenticated: "<red>请先登录。</red>"
  bind:
    usage: "<red>用法：/bind <渠道> [值]</red>"
    email-usage: "<red>用法：/bind email <邮箱地址></red>"
    email-domains-allow: "<gray>支持的邮箱域名：{domains}</gray>"
    email-domains-deny: "<gray>禁止使用的邮箱域名：{domains}</gray>"
    email-domains-any: "<gray>邮箱域名不限。</gray>"
    email-invalid: "<red>邮箱地址格式不正确。</red>"
    domain-not-allowed: "<red>该邮箱域名不被允许。</red>"
    limit: "<red>该 {provider} 已绑定的账号数已达上限。</red>"
    already-bound: "<red>你已绑定了该渠道。</red>"
    cooldown: "<red>该渠道标识近期刚被解绑或注销，暂时无法再次绑定，请稍后再试。</red>"
    success: "<green>绑定成功。</green>"
    activated: "<green>绑定成功，账号已激活，正在进入服务器…</green>"
    required: "<yellow>- 绑定 {provider}：</yellow><click:suggest_command:'/bind {provider}'><hover:show_text:'<gray>点击填充：/bind {provider}</gray>'><gold><bold>[绑定 {provider}]</bold></gold></hover></click>"
    not-authenticated: "<red>请先 /register 注册账号，或先 /login 登录。</red>"
    verifying: "<yellow>验证通过后即完成绑定。</yellow>"
  unbind:
    usage: "<red>用法：/unbind <渠道></red>"
    success: "<green>解绑成功。</green>"
    not-bound: "<red>你尚未绑定该类型。</red>"
    required: "<red>该 {provider} 绑定是登录所必需的，请先绑定其它渠道再解绑。</red>"
    verifying: "<yellow>请完成验证以确认解绑。</yellow>"
    not-authenticated: "<red>请先登录。</red>"
  forgot:
    usage: "<red>用法：/forgot <账号> [渠道]</red>"
    choose-channel: "<yellow>请选择找回方式：/forgot <账号> {channels}</yellow>"
    invalid-channel: "<red>无效的找回方式。</red>"
    verified: "<green>验证成功，请设置新密码：/resetpassword <新密码> <确认密码></green>"
    new-password: "<green>验证成功，请使用 /login <账号> <新密码> 重新登录，或输入新密码完成重置。</green>"
  resetpassword:
    usage: "<red>用法：/resetpassword <新密码> <确认密码></red>"
    success: "<green>密码已重置，正在进入服务器…</green>"
    binding-required: "<red>密码已重置，但该账号仍需先完成绑定才能登录。</red>"
    mismatch: "<red>两次输入的密码不一致，请重新 /forgot。</red>"
    no-grant: "<red>没有可用的重置授权，请先 /forgot <账号> <渠道> 并完成验证。</red>"
  deleteaccount:
    request: "<yellow>注销账号 {account} 需要二次验证，请先完成验证。</yellow>"
    no-binding: "<red>该账号未绑定邮箱或 QQ，无法完成二次验证；请先用 /bind 绑定一个渠道。</red>"
    deleted: "<red>账号 {account} 已注销，感谢游玩。</red>"
  recover:
    new-password-prompt: "<yellow>验证成功，请输入新密码：/changepassword <旧密码> <新密码> 或使用管理命令重置。</yellow>"
    success: "<green>密码已重置，请重新登录。</green>"

verification:
  # 操作名称：用于 {action} 占位符，让邮件与提示能区分这次验证是注册 / 绑定 / 找回等
  actions:
    register: "注册"
    bind-email: "邮箱绑定"
    bind-social: "社交绑定"
    recover: "找回密码"
    unbind: "解绑"
    delete-account: "账号注销"
  email-sent: "<yellow>「{action}」验证码已发送至 {email}，请在 {minutes} 分钟内完成验证：</yellow><click:suggest_command:'/verify '><hover:show_text:'<gray>点击填充 /verify</gray>'><gold><bold>[输入验证码]</bold></gold></hover></click>"
  email-sent-bound: "<yellow>「{action}」验证码已发送至你绑定的邮箱，请在 {minutes} 分钟内完成验证：</yellow><click:suggest_command:'/verify '><hover:show_text:'<gray>点击填充 /verify</gray>'><gold><bold>[输入验证码]</bold></gold></hover></click>"
  email-sending: "<yellow>正在发送验证码，请稍候…</yellow>"
  email-failed: "<red>验证码发送失败，请联系管理员。</red>"
  email-unavailable: "<red>邮箱服务当前不可用。</red>"
  social-instruction: "<yellow>「{action}」请在 {channels} 发送下面的验证码（点一下即可复制）：</yellow>"
  social-unavailable: "<red>社交验证服务当前不可用。</red>"
  code-line: "<click:copy_to_clipboard:'{code}'><hover:show_text:'<gray>点击复制验证码</gray>'><gold><bold>  [ {code} ]</bold></gold></hover></click>"
  code-prompt: "<yellow>发送后请等待验证结果，无需在游戏内输入。</yellow>"
  cancel-usage: "<red>用法：/verify <验证码> 或 /verify cancel</red>"
  cancelled: "<yellow>验证已取消。</yellow>"
  cancelled-by-player: "<yellow>你已取消本次验证。</yellow>"
  wrong-code: "<red>验证码错误，还可尝试 {remaining} 次。</red>"
  wrong-channel: "<red>该验证需要在社交渠道中完成，请在对应的群里发送验证码。</red>"
  expired: "<red>验证已过期，请重新发起。</red>"
  too-many-attempts: "<red>尝试次数过多，验证已作废。</red>"
  success: "<green>验证成功。</green>"
  rate-limited: "<red>操作过于频繁，请稍后再试。</red>"
  no-session: "<red>当前没有进行中的验证，请先发起。</red>"
  already-pending: "<yellow>已有一个进行中的验证，请先完成或等待其过期。</yellow>"
  qq-matched: "<green>已收到群消息验证。</green>"

auth:
  login-required: "<red>请先登录后再进行该操作。</red> <click:suggest_command:'/login '><hover:show_text:'<gray>点击填充 /login</gray>'><gold>[登录]</gold></hover></click>"
  kick-login-required: "<red>请先登录。</red>"
  session-restored: "<green>已通过会话保持自动登录。</green>"
  authenticated: "<green>身份验证通过。</green>"
  account-locked: "<red>该账号已被锁定。</red>"
  reconnect-required: "<yellow>请重新连接。</yellow>"
  logout-disconnect: "<yellow>已退出登录，请重新连接。</yellow>"
  login-disconnect: "<green>登录成功，请重新连接。</green>"

routing:
  joining-login: "<yellow>请先登录或注册：</yellow> <click:suggest_command:'/login '><hover:show_text:'<gray>点击填充：/login 【账号】 【密码】</gray>'><gold><bold>[登录]</bold></gold></hover></click> <click:suggest_command:'/register '><hover:show_text:'<gray>点击填充：/register 【账号】 【密码】 【确认密码】</gray>'><green><bold>[注册]</bold></green></hover></click> <click:suggest_command:'/forgot '><hover:show_text:'<gray>点击填充：/forgot 【账号】 【渠道】</gray>'><aqua><bold>[忘记密码]</bold></aqua></hover></click>"
  joining-login-known: "<yellow>欢迎回来 {account}，请登录：</yellow> <click:suggest_command:'/login {account} '><hover:show_text:'<gray>点击填充：/login {account} 【密码】</gray>'><gold><bold>[登录]</bold></gold></hover></click> <click:suggest_command:'/forgot '><hover:show_text:'<gray>点击填充：/forgot 【账号】 【渠道】</gray>'><aqua><bold>[忘记密码]</bold></aqua></hover></click>"
  joining-login-usage-login: "<gray>登录：</gray><white>/login <账号> <密码></white>"
  joining-login-usage-login-known: "<gray>登录：</gray><white>/login {account} <密码></white>"
  joining-login-usage-register: "<gray>注册：</gray><white>/register <账号> <密码> <确认密码></white>"
  joining-login-usage-forgot: "<gray>忘记密码：</gray><white>/forgot <账号> <渠道></white>"
  joining-default: "<gray>正在进入 {server}…</gray>"
  joining-last: "<gray>正在回到上次所在的服务器 {server}…</gray>"
  not-allowed: "<red>你无权进入该服务器。</red>"
  server-not-found: "<red>目标服务器不存在。</red>"
  login-server-missing: "<red>登录服 {server} 未在代理中注册，请联系管理员。</red>"

admin:
  status:
    header: "<gold>===== VelocityAuth 状态 ====="
    database: "<gray>数据库：</gray><white>{value}</white>"
    smtp: "<gray>SMTP：</gray><white>{value}</white>"
    bot: "<gray>Bot 通道：</gray><white>{value}</white>"
    sessions: "<gray>在线已认证会话：</gray><white>{value}</white>"
    pending-verifications: "<gray>进行中的验证：</gray><white>{value}</white>"
    paired-clients: "<gray>已配对 bot 客户端：</gray><white>{value}</white>"
    floodgate: "<gray>基岩端（Floodgate）：</gray><white>{value}</white>"
    bedrock-link: "<gray>基岩账号关联（Floodgate link）：</gray><white>{value}</white>"
    enabled: "<green>已启用</green>"
    disabled: "<red>已关闭</red>"
    connected: "<green>已连接</green>"
    disconnected: "<red>未连接</red>"
  account:
    not-found: "<red>账号不存在：{account}</red>"
    info-header: "<gold>===== 账号 {account} ====="
    info-id: "<gray>ID：</gray><white>{value}</white>"
    info-uuid: "<gray>UUID：</gray><click:copy_to_clipboard:'{value}'><hover:show_text:'<gray>点击复制 UUID</gray>'><white>{value}</white></hover></click>"
    info-status: "<gray>状态：</gray><white>{value}</white>"
    info-bindings: "<gray>绑定：</gray><white>{value}</white>"
    info-last-server: "<gray>上次子服：</gray><white>{value}</white>"
    info-identities: "<gray>身份数：</gray><white>{value}</white>"
    info-created: "<gray>注册时间：</gray><white>{value}</white>"
    info-last-login: "<gray>上次登录：</gray><white>{value}</white>"
    none: "<gray>无</gray>"
    password-set: "<green>已重置 {account} 的密码。</green>"
    unbound: "<green>已解绑 {account} 的 {type}。</green>"
    locked: "<green>已锁定账号 {account}。</green>"
    unlocked: "<green>已解锁账号 {account}。</green>"
    deleted: "<green>已删除账号 {account}。</green>"
  forcelogin:
    usage: "<red>用法：/vauth forcelogin <账号> [--kick]</red>"
    success: "<green>已为你的连接创建强制登录绑定，请重新连接以生效。</green>"
    kicked: "<yellow>已踢出该账号的 {count} 个在线会话。</yellow>"
  sessions:
    header: "<gold>===== 在线已认证会话 ====="
    entry: "<gray>- </gray><white>{account}</white><gray> @ </gray><white>{ip}</white><gray> 连接名 </gray><white>{name}</white>"
    empty: "<gray>（无）</gray>"
    kicked: "<green>已踢出账号 {account} 的 {count} 个会话。</green>"
  pair:
    created: "<green>已生成配对码，点一下即可复制，然后配置到 bot 侧：</green>"
    created-id: "<gray>pairing_id：</gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>点击复制 pairing_id</gray>'><white>{id}</white></hover></click>"
    created-code: "<gray>code：</gray><click:copy_to_clipboard:'{code}'><hover:show_text:'<gray>点击复制配对码</gray>'><white>{code}</white></hover></click>"
    created-ttl: "<gray>有效期：</gray><white>{ttl} 秒</white>"
    list-header: "<gold>===== 待配对记录 ====="
    list-entry: "<gray>- </gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>点击复制 pairing_id</gray>'><white>{id}</white></hover></click><gray> 剩余 </gray><white>{ttl}</white><gray> 秒，尝试 </gray><white>{attempts}</white>"
    empty: "<gray>（无）</gray>"
    revoked: "<green>已撤销配对 {id}。</green>"
    not-found: "<red>配对记录不存在：{id}</red>"
  client:
    list-header: "<gold>===== 已配对 bot 客户端 ====="
    list-entry: "<gray>- </gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>点击复制 client_id</gray>'><white>{id}</white></hover></click><gray> 指纹 </gray><click:copy_to_clipboard:'{fingerprint}'><hover:show_text:'<gray>点击复制指纹</gray>'><white>{fingerprint}</white></hover></click><gray> 最近 </gray><white>{last_seen}</white>"
    empty: "<gray>（无）</gray>"
    revoked: "<green>已撤销客户端 {id}。</green>"
    not-found: "<red>客户端不存在：{id}</red>"
