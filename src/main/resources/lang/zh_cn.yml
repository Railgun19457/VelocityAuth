# ============ VelocityAuth 中文语言文件 ============
# 文本使用 MiniMessage 语法；{xxx} 为占位符。
prefix: "<gold>[认证]</gold> "

generic:
  player-only: "<red>该命令只能由玩家执行。</red>"
  no-permission: "<red>你没有权限执行该命令。</red>"
  internal-error: "<red>服务器内部错误，请稍后再试。</red>"
  reloaded: "<green>配置与语言文件已重载。</green>"
  not-authenticated: "<red>请先登录。</red>"
  already-authenticated: "<red>你已经登录了。</red>"
  unknown-subcommand: "<red>未知子命令：{input}</red>"
  feature-disabled: "<red>该功能当前已关闭。</red>"
  usage: "<red>用法：{usage}</red>"

command:
  login:
    usage: "<red>用法：/login <账号> <密码></red>"
    success: "<green>登录成功，正在进入服务器…</green>"
    wrong-password: "<red>账号或密码错误。</red>"
    already-authenticated: "<red>你已经登录了。</red>"
    reconnect: "<green>登录成功，请重新连接以进入服务器。</green>"
    rate-limited: "<red>尝试过于频繁，请稍后再试。</red>"
    locked: "<red>该账号已被锁定，请联系管理员。</red>"
  register:
    usage: "<red>用法：/register <账号> <密码> [确认密码]</red>"
    success: "<green>注册成功，正在进入服务器…</green>"
    name-taken: "<red>该账号名已被占用。</red>"
    name-invalid: "<red>账号名不合法：长度需在 {min}-{max} 之间，且只能包含字母、数字与下划线。</red>"
    password-too-short: "<red>密码太短，至少需要 {min} 个字符。</red>"
    password-too-long: "<red>密码太长，最多 {max} 个字符。</red>"
    password-mismatch: "<red>两次输入的密码不一致。</red>"
    already-registered: "<red>你已经注册或登录了。</red>"
    rate-limited: "<red>注册过于频繁，请稍后再试。</red>"
    gate-email: "<yellow>本服开启邮箱验证，请先绑定邮箱后再注册。</yellow>"
    gate-qq: "<yellow>本服开启 QQ 验证，请先绑定 QQ 后再注册。</yellow>"
  logout:
    success: "<yellow>已退出登录，请重新连接。</yellow>"
    not-authenticated: "<red>你尚未登录。</red>"
  changepassword:
    usage: "<red>用法：/changepassword <旧密码> <新密码></red>"
    success: "<green>密码修改成功。</green>"
    wrong-password: "<red>旧密码错误。</red>"
    same-as-old: "<red>新密码不能与旧密码相同。</red>"
    not-authenticated: "<red>请先登录。</red>"
  bind:
    usage: "<red>用法：/bind <email|qq> [值]</red>"
    email-usage: "<red>用法：/bind email <邮箱地址></red>"
    email-invalid: "<red>邮箱地址格式不正确。</red>"
    domain-not-allowed: "<red>该邮箱域名不被允许。</red>"
    email-limit: "<red>该邮箱已绑定的账号数已达上限。</red>"
    qq-limit: "<red>该 QQ 已绑定的账号数已达上限。</red>"
    already-bound: "<red>你已绑定了该类型。</red>"
    success: "<green>绑定成功。</green>"
    not-authenticated: "<red>请先登录。</red>"
  unbind:
    usage: "<red>用法：/unbind <email|qq></red>"
    success: "<green>解绑成功。</green>"
    not-bound: "<red>你尚未绑定该类型。</red>"
    not-authenticated: "<red>请先登录。</red>"
  forgot:
    usage: "<red>用法：/forgot <账号></red>"
    request-received: "<yellow>如果该账号存在，我们已准备好可用的找回方式。</yellow>"
    no-binding: "<yellow>如果该账号存在，我们已准备好可用的找回方式。</yellow>"
    choose-channel: "<yellow>请选择找回方式：{channels}</yellow>"
    invalid-channel: "<red>无效的找回方式。</red>"
    new-password: "<green>验证成功，请使用 /login <账号> <新密码> 重新登录，或输入新密码完成重置。</green>"
  recover:
    new-password-prompt: "<yellow>验证成功，请输入新密码：/changepassword <旧密码> <新密码> 或使用管理命令重置。</yellow>"
    success: "<green>密码已重置，请重新登录。</green>"

verification:
  email-sent: "<yellow>验证码已发送至 {email}，请在 {minutes} 分钟内输入。</yellow>"
  email-sending: "<yellow>正在发送验证码，请稍候…</yellow>"
  email-failed: "<red>验证码发送失败，请联系管理员。</red>"
  email-unavailable: "<red>邮箱服务当前不可用。</red>"
  qq-instruction: "<yellow>请在 QQ 群 {group} 发送以下验证码（点击可复制）：</yellow>"
  qq-unavailable: "<red>QQ 验证服务当前不可用。</red>"
  code-prompt: "<yellow>请输入验证码：/verify <验证码></yellow>"
  wrong-code: "<red>验证码错误，还可尝试 {remaining} 次。</red>"
  expired: "<red>验证已过期，请重新发起。</red>"
  too-many-attempts: "<red>尝试次数过多，验证已作废。</red>"
  cancelled: "<yellow>验证已取消。</yellow>"
  success: "<green>验证成功。</green>"
  rate-limited: "<red>操作过于频繁，请稍后再试。</red>"
  no-session: "<red>当前没有进行中的验证，请先发起。</red>"
  already-pending: "<yellow>已有一个进行中的验证，请先完成或等待其过期。</yellow>"
  qq-matched: "<green>已收到群消息验证。</green>"

auth:
  login-required: "<red>请先登录后再进行该操作。</red>"
  kick-login-required: "<red>请先登录。</red>"
  session-restored: "<green>已通过会话保持自动登录。</green>"
  authenticated: "<green>身份验证通过。</green>"
  account-locked: "<red>该账号已被锁定。</red>"
  name-occupied: "<red>名称 {name} 已被占用，无法使用。</red>"
  reconnect-required: "<yellow>请重新连接。</yellow>"
  logout-disconnect: "<yellow>已退出登录，请重新连接。</yellow>"
  login-disconnect: "<green>登录成功，请重新连接。</green>"

routing:
  joining-login: "<yellow>请先登录：/login <账号> <密码> 或 /register <账号> <密码></yellow>"
  joining-default: "<gray>正在进入 {server}…</gray>"
  joining-last: "<gray>正在回到上次所在的服务器 {server}…</gray>"
  not-allowed: "<red>你无权进入该服务器。</red>"
  server-not-found: "<red>目标服务器不存在。</red>"
  login-server-missing: "<red>登录服 {server} 未在代理中注册，请联系管理员。</red>"

admin:
  status:
    header: "<gold>===== VelocityAuth 状态 ====="
    database: "<gray>数据库：</gray><white>{value}</white>"
    smtp: "<gray>SMTP：</gray><white>{value}</white>"
    qqbot: "<gray>QQ bot：</gray><white>{value}</white>"
    sessions: "<gray>在线已认证会话：</gray><white>{value}</white>"
    pending-verifications: "<gray>进行中的验证：</gray><white>{value}</white>"
    paired-clients: "<gray>已配对 bot 客户端：</gray><white>{value}</white>"
    enabled: "<green>已启用</green>"
    disabled: "<red>已关闭</red>"
    connected: "<green>已连接</green>"
    disconnected: "<red>未连接</red>"
  account:
    not-found: "<red>账号不存在：{account}</red>"
    info-header: "<gold>===== 账号 {account} ====="
    info-id: "<gray>ID：</gray><white>{value}</white>"
    info-uuid: "<gray>UUID：</gray><white>{value}</white>"
    info-status: "<gray>状态：</gray><white>{value}</white>"
    info-email: "<gray>邮箱：</gray><white>{value}</white>"
    info-qq: "<gray>QQ：</gray><white>{value}</white>"
    info-last-server: "<gray>上次子服：</gray><white>{value}</white>"
    info-identities: "<gray>身份数：</gray><white>{value}</white>"
    info-created: "<gray>注册时间：</gray><white>{value}</white>"
    info-last-login: "<gray>上次登录：</gray><white>{value}</white>"
    none: "<gray>无</gray>"
    password-set: "<green>已重置 {account} 的密码。</green>"
    unbound: "<green>已解绑 {account} 的 {type}。</green>"
    locked: "<green>已锁定账号 {account}。</green>"
    unlocked: "<green>已解锁账号 {account}。</green>"
    deleted: "<green>已删除账号 {account}。</green>"
  forcelogin:
    usage: "<red>用法：/vauth forcelogin <账号> [--kick]</red>"
    success: "<green>已为你的连接创建强制登录绑定，请重新连接以生效。</green>"
    kicked: "<yellow>已踢出该账号的 {count} 个在线会话。</yellow>"
  sessions:
    header: "<gold>===== 在线已认证会话 ====="
    entry: "<gray>- </gray><white>{account}</white><gray> @ </gray><white>{ip}</white><gray> 连接名 </gray><white>{name}</white>"
    empty: "<gray>（无）</gray>"
    kicked: "<green>已踢出账号 {account} 的 {count} 个会话。</green>"
  pair:
    created: "<green>已生成配对码，请配置到 bot 侧：</green>"
    created-id: "<gray>pairing_id：</gray><white>{id}</white>"
    created-code: "<gray>code：</gray><white>{code}</white>"
    created-ttl: "<gray>有效期：</gray><white>{ttl} 秒</white>"
    list-header: "<gold>===== 待配对记录 ====="
    list-entry: "<gray>- </gray><white>{id}</white><gray> 剩余 </gray><white>{ttl}</white><gray> 秒，尝试 </gray><white>{attempts}</white>"
    empty: "<gray>（无）</gray>"
    revoked: "<green>已撤销配对 {id}。</green>"
    not-found: "<red>配对记录不存在：{id}</red>"
  client:
    list-header: "<gold>===== 已配对 bot 客户端 ====="
    list-entry: "<gray>- </gray><white>{id}</white><gray> 指纹 </gray><white>{fingerprint}</white><gray> 最近 </gray><white>{last_seen}</white>"
    empty: "<gray>（无）</gray>"
    revoked: "<green>已撤销客户端 {id}。</green>"
    not-found: "<red>客户端不存在：{id}</red>"

migration:
  header: "<gold>===== LibreLogin 迁移 ====="
  not-found: "<red>未找到 LibreLogin 数据库。</red>"
  started: "<yellow>开始迁移…</yellow>"
  imported: "<green>已导入 {count} 个账号。</green>"
  skipped: "<yellow>跳过 {count} 个已存在账号。</yellow>"
  needs-reset: "<yellow>{count} 个账号密码格式不兼容，已标记为需重置。</yellow>"
  done: "<green>迁移完成。</green>"
