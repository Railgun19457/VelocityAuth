# version: 4
# ============ VelocityAuth English language file ============
# Text uses MiniMessage syntax; {xxx} are placeholders.
prefix: "<gold>[Auth]</gold> "

generic:
  player-only: "<red>This command can only be run by a player.</red>"
  no-permission: "<red>You do not have permission to run this command.</red>"
  internal-error: "<red>Internal server error, please try again later.</red>"
  reloaded: "<green>Configuration and language files reloaded.</green>"
  not-authenticated: "<red>Please log in first.</red>"
  already-authenticated: "<red>You are already logged in.</red>"
  unknown-subcommand: "<red>Unknown subcommand: {input}</red>"
  feature-disabled: "<red>This feature is currently disabled.</red>"
  usage: "<red>Usage: {usage}</red>"

command:
  login:
    usage: "<red>Usage: /login <account> <password></red>"
    success: "<green>Logged in, entering the server…</green>"
    wrong-password: "<red>Incorrect account or password.</red>"
    already-authenticated: "<red>You are already logged in.</red>"
    reconnect: "<green>Logged in. Please reconnect to enter the server.</green>"
    rate-limited: "<red>Too many attempts, please try again later.</red>"
    locked: "<red>This account is locked. Please contact an administrator.</red>"
    binding-required: "<red>Password is correct, but this account must complete binding before it can log in.</red>"
  register:
    usage: "<red>Usage: /register <account> <password> <confirm password></red>"
    success: "<green>Registered, entering the server…</green>"
    success-pending: "<green>Registration succeeded!</green> <yellow>Account {account} must complete binding before it can log in.</yellow>"
    name-taken: "<red>That account name is already taken.</red>"
    name-invalid: "<red>Invalid account name: length must be {min}-{max} and contain only letters, digits and underscores.</red>"
    password-too-short: "<red>Password too short, at least {min} characters.</red>"
    password-too-long: "<red>Password too long, at most {max} characters.</red>"
    password-too-long-bytes: "<red>Password too long: at most {bytes} bytes after UTF-8 encoding (bcrypt limit), please shorten it.</red>"
    password-mismatch: "<red>The two passwords do not match.</red>"
    already-registered: "<red>You are already registered or logged in.</red>"
    rate-limited: "<red>Too many registrations, please try again later.</red>"
  logout:
    success: "<yellow>Logged out. Please reconnect.</yellow>"
    not-authenticated: "<red>You are not logged in.</red>"
  verify:
    usage: "<red>Usage: /verify <code> (or /verify cancel)</red>"
    success: "<green>Verified successfully.</green>"
  changepassword:
    usage: "<red>Usage: /changepassword <old password> <new password></red>"
    success: "<green>Password changed successfully.</green>"
    wrong-password: "<red>Incorrect old password.</red>"
    same-as-old: "<red>The new password must differ from the old one.</red>"
    not-authenticated: "<red>Please log in first.</red>"
  bind:
    usage: "<red>Usage: /bind <channel> [value]</red>"
    email-usage: "<red>Usage: /bind email <address></red>"
    email-domains-allow: "<gray>Supported email domains: {domains}</gray>"
    email-domains-deny: "<gray>Blocked email domains: {domains}</gray>"
    email-domains-any: "<gray>Any email domain is allowed.</gray>"
    email-invalid: "<red>Invalid email address.</red>"
    domain-not-allowed: "<red>That email domain is not allowed.</red>"
    limit: "<red>This {provider} has reached the maximum number of bound accounts.</red>"
    already-bound: "<red>You have already bound this channel.</red>"
    cooldown: "<red>This identifier was recently unbound or its account deleted; please try again later.</red>"
    success: "<green>Bound successfully.</green>"
    activated: "<green>Bound successfully, account activated, entering the server…</green>"
    required: "<yellow>- Bind {provider}:</yellow> <click:suggest_command:'/bind {provider}'><hover:show_text:'<gray>Click to fill: /bind {provider}</gray>'><gold><bold>[Bind {provider}]</bold></gold></hover></click>"
    not-authenticated: "<red>Please /register first, or /login.</red>"
    verifying: "<yellow>The binding completes once verification succeeds.</yellow>"
  unbind:
    usage: "<red>Usage: /unbind <channel></red>"
    success: "<green>Unbound successfully.</green>"
    not-bound: "<red>You have not bound this channel.</red>"
    required: "<red>This {provider} binding is required for logging in. Bind another channel before unbinding it.</red>"
    verifying: "<yellow>Complete verification to confirm unbinding.</yellow>"
    not-authenticated: "<red>Please log in first.</red>"
  forgot:
    usage: "<red>Usage: /forgot <account> [channel]</red>"
    choose-channel: "<yellow>Choose a recovery method: /forgot <account> {channels}</yellow>"
    invalid-channel: "<red>Invalid recovery method.</red>"
    verified: "<green>Verified. Set a new password: /resetpassword <new password> <confirm></green>"
    new-password: "<green>Verified. Please log in again with /login <account> <new password>.</green>"
  resetpassword:
    usage: "<red>Usage: /resetpassword <new password> <confirm></red>"
    success: "<green>Password reset, entering the server…</green>"
    binding-required: "<red>Password was reset, but this account must still complete binding before it can log in.</red>"
    mismatch: "<red>The two passwords do not match, please run /forgot again.</red>"
    no-grant: "<red>No valid reset grant. Run /forgot <account> <channel> and complete verification first.</red>"
  deleteaccount:
    request: "<yellow>Deleting account {account} requires secondary verification, please verify first.</yellow>"
    no-binding: "<red>This account has no bound channel, so secondary verification is impossible. Bind a channel with /bind first.</red>"
    deleted: "<red>Account {account} has been deleted. Thanks for playing.</red>"
  recover:
    new-password-prompt: "<yellow>Verified. Set a new password with /changepassword <old> <new> or via an admin command.</yellow>"
    success: "<green>Password reset. Please log in again.</green>"

verification:
  # 操作名称：用于 {action} 占位符，让邮件与提示能区分这次验证是注册 / 绑定 / 找回等
  actions:
    register: "Registration"
    bind-email: "Email binding"
    bind-social: "Social binding"
    recover: "Password recovery"
    unbind: "Unbinding"
    delete-account: "Account deletion"
  email-sent: "<yellow>[{action}] A verification code was sent to {email}, complete it within {minutes} minutes:</yellow> <click:suggest_command:'/verify '><hover:show_text:'<gray>Click to fill /verify</gray>'><gold><bold>[Enter code]</bold></gold></hover></click>"
  email-sent-bound: "<yellow>[{action}] A verification code was sent to your bound email, complete it within {minutes} minutes:</yellow> <click:suggest_command:'/verify '><hover:show_text:'<gray>Click to fill /verify</gray>'><gold><bold>[Enter code]</bold></gold></hover></click>"
  email-sending: "<yellow>Sending the verification code, please wait…</yellow>"
  email-failed: "<red>Failed to send the verification code, please contact an administrator.</red>"
  email-unavailable: "<red>Email service is currently unavailable.</red>"
  social-instruction: "<yellow>[{action}] Please send the code below in {channels} (click to copy):</yellow>"
  social-unavailable: "<red>Social verification service is currently unavailable.</red>"
  code-line: "<click:copy_to_clipboard:'{code}'><hover:show_text:'<gray>Click to copy the code</gray>'><gold><bold>  [ {code} ]</bold></gold></hover></click>"
  code-prompt: "<yellow>Wait for the verification result after sending, no in-game input needed.</yellow>"
  cancel-usage: "<red>Usage: /verify <code> or /verify cancel</red>"
  cancelled: "<yellow>Verification cancelled.</yellow>"
  cancelled-by-player: "<yellow>You cancelled this verification.</yellow>"
  wrong-code: "<red>Wrong code, {remaining} attempts left.</red>"
  wrong-channel: "<red>This verification must be completed in the social channel; sending the code in-game has no effect.</red>"
  expired: "<red>Verification expired, please start again.</red>"
  too-many-attempts: "<red>Too many attempts, verification voided.</red>"
  success: "<green>Verified successfully.</green>"
  rate-limited: "<red>Too many requests, please try again later.</red>"
  no-session: "<red>There is no verification in progress.</red>"
  already-pending: "<yellow>A verification is already in progress, please finish it or wait for it to expire.</yellow>"
  qq-matched: "<green>Group message verification received.</green>"

auth:
  login-required: "<red>Please log in before doing that.</red> <click:suggest_command:'/login '><hover:show_text:'<gray>Click to fill /login</gray>'><gold>[Login]</gold></hover></click>"
  kick-login-required: "<red>Please log in.</red>"
  session-restored: "<green>Automatically logged in via session persistence.</green>"
  authenticated: "<green>Authentication successful.</green>"
  account-locked: "<red>This account is locked.</red>"
  reconnect-required: "<yellow>Please reconnect.</yellow>"
  logout-disconnect: "<yellow>Logged out, please reconnect.</yellow>"
  login-disconnect: "<green>Logged in, please reconnect.</green>"

routing:
  joining-login: "<yellow>Please log in or register:</yellow> <click:suggest_command:'/login '><hover:show_text:'<gray>Click to fill: /login [account] [password]</gray>'><gold><bold>[Login]</bold></gold></hover></click> <click:suggest_command:'/register '><hover:show_text:'<gray>Click to fill: /register [account] [password] [confirm password]</gray>'><green><bold>[Register]</bold></green></hover></click> <click:suggest_command:'/forgot '><hover:show_text:'<gray>Click to fill: /forgot [account] [channel]</gray>'><aqua><bold>[Forgot password]</bold></aqua></hover></click>"
  joining-login-usage-login: "<gray>Login: </gray><white>/login <account> <password></white>"
  joining-login-usage-register: "<gray>Register: </gray><white>/register <account> <password> <confirm password></white>"
  joining-login-usage-forgot: "<gray>Forgot password: </gray><white>/forgot <account> <channel></white>"
  joining-default: "<gray>Entering {server}…</gray>"
  joining-last: "<gray>Returning to your last server {server}…</gray>"
  not-allowed: "<red>You are not allowed to join that server.</red>"
  server-not-found: "<red>That server does not exist.</red>"
  login-server-missing: "<red>Login server {server} is not registered on the proxy, contact an administrator.</red>"

admin:
  status:
    header: "<gold>===== VelocityAuth status ====="
    database: "<gray>Database: </gray><white>{value}</white>"
    smtp: "<gray>SMTP: </gray><white>{value}</white>"
    bot: "<gray>Bot channel: </gray><white>{value}</white>"
    sessions: "<gray>Authenticated sessions: </gray><white>{value}</white>"
    pending-verifications: "<gray>Pending verifications: </gray><white>{value}</white>"
    paired-clients: "<gray>Paired bot clients: </gray><white>{value}</white>"
    floodgate: "<gray>Bedrock (Floodgate): </gray><white>{value}</white>"
    bedrock-link: "<gray>Bedrock account link (Floodgate): </gray><white>{value}</white>"
    enabled: "<green>enabled</green>"
    disabled: "<red>disabled</red>"
    connected: "<green>connected</green>"
    disconnected: "<red>disconnected</red>"
  account:
    not-found: "<red>Account not found: {account}</red>"
    info-header: "<gold>===== Account {account} ====="
    info-id: "<gray>ID: </gray><white>{value}</white>"
    info-uuid: "<gray>UUID: </gray><click:copy_to_clipboard:'{value}'><hover:show_text:'<gray>Click to copy UUID</gray>'><white>{value}</white></hover></click>"
    info-status: "<gray>Status: </gray><white>{value}</white>"
    info-bindings: "<gray>Bindings: </gray><white>{value}</white>"
    info-last-server: "<gray>Last server: </gray><white>{value}</white>"
    info-identities: "<gray>Identities: </gray><white>{value}</white>"
    info-created: "<gray>Created: </gray><white>{value}</white>"
    info-last-login: "<gray>Last login: </gray><white>{value}</white>"
    none: "<gray>none</gray>"
    password-set: "<green>Password for {account} has been reset.</green>"
    unbound: "<green>Unbound {type} from {account}.</green>"
    locked: "<green>Account {account} locked.</green>"
    unlocked: "<green>Account {account} unlocked.</green>"
    deleted: "<green>Account {account} deleted.</green>"
  forcelogin:
    usage: "<red>Usage: /vauth forcelogin <account> [--kick]</red>"
    success: "<green>A force-login binding was created for your connection, please reconnect.</green>"
    kicked: "<yellow>Kicked {count} online session(s) of that account.</yellow>"
  sessions:
    header: "<gold>===== Authenticated sessions ====="
    entry: "<gray>- </gray><white>{account}</white><gray> @ </gray><white>{ip}</white><gray> as </gray><white>{name}</white>"
    empty: "<gray>(none)</gray>"
    kicked: "<green>Kicked {count} session(s) of {account}.</green>"
  pair:
    created: "<green>Pairing code generated, click to copy, then configure it on the bot side:</green>"
    created-id: "<gray>pairing_id: </gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>Click to copy pairing_id</gray>'><white>{id}</white></hover></click>"
    created-code: "<gray>code: </gray><click:copy_to_clipboard:'{code}'><hover:show_text:'<gray>Click to copy pairing code</gray>'><white>{code}</white></hover></click>"
    created-ttl: "<gray>TTL: </gray><white>{ttl} seconds</white>"
    list-header: "<gold>===== Pending pairings ====="
    list-entry: "<gray>- </gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>Click to copy pairing_id</gray>'><white>{id}</white></hover></click><gray> ttl </gray><white>{ttl}</white><gray>s, attempts </gray><white>{attempts}</white>"
    empty: "<gray>(none)</gray>"
    revoked: "<green>Pairing {id} revoked.</green>"
    not-found: "<red>Pairing not found: {id}</red>"
  client:
    list-header: "<gold>===== Paired bot clients ====="
    list-entry: "<gray>- </gray><click:copy_to_clipboard:'{id}'><hover:show_text:'<gray>Click to copy client_id</gray>'><white>{id}</white></hover></click><gray> fingerprint </gray><click:copy_to_clipboard:'{fingerprint}'><hover:show_text:'<gray>Click to copy fingerprint</gray>'><white>{fingerprint}</white></hover></click><gray> last seen </gray><white>{last_seen}</white>"
    empty: "<gray>(none)</gray>"
    revoked: "<green>Client {id} revoked.</green>"
    not-found: "<red>Client not found: {id}</red>"
