# version: 1
# ============ 验证码邮件模板 ============
# 占位符：{action} 操作名称（注册/邮箱绑定/找回密码…，取自 lang 的 verification.actions）
#         {code} 验证码 | {minutes} 有效期（分钟） | {server} 服务器名
# 修改后可用 /vauth reload 热重载。本文件不会被升级覆盖，请自行备份。

subject: "【{server}】{action}验证码"

# HTML 正文（绝大多数邮箱客户端显示这份）。样式必须写成内联 style，邮箱客户端会过滤 <style> 块。
html: |
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{action}验证码</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7f9;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;background-color:#ffffff;border:1px solid #e9ebef;border-radius:10px;">
            <tr>
              <td style="height:3px;background-color:#4f7cff;border-radius:10px 10px 0 0;"></td>
            </tr>
            <tr>
              <td style="padding:30px 36px 0;">
                <div style="font-size:15px;font-weight:600;color:#111827;">{server}</div>
                <div style="font-size:13px;color:#8b93a1;margin-top:6px;">{action}验证码</div>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 36px 0;">
                <div style="font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;background-color:#f6f8fb;border-radius:8px;padding:16px 0;text-align:center;">{code}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 0;">
                <div style="font-size:13px;color:#6b7280;line-height:1.8;">验证码 {minutes} 分钟内有效，请勿泄露给他人。</div>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 36px 30px;">
                <div style="border-top:1px solid #eef0f4;padding-top:16px;font-size:12px;color:#9aa1ad;line-height:1.8;">如果这不是你本人的操作，请忽略本邮件。</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
  </html>

# 纯文本正文（不支持 HTML 的老客户端 / 反垃圾检查用），留空则只发 HTML
text: |
  {server}

  【{action}】你的验证码是：{code}

  验证码 {minutes} 分钟内有效，请勿泄露给他人。
  如果这不是你本人的操作，请忽略本邮件。
